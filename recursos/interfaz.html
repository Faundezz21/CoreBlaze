<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CoreBlaze</title>
<style>
:root{
  --bg:#070b14;--bg-2:#0a1020;--side:#080d19;
  --card:rgba(15,22,40,.72);--card-2:rgba(20,29,52,.85);--card-hover:rgba(22,32,58,.9);
  --line:rgba(148,163,184,.10);--line-2:rgba(148,163,184,.18);--line-3:rgba(148,163,184,.28);
  --text:#eef2f8;--text-2:#9aa6bb;--text-3:#5f6b84;
  --cpu:#3b8cff;--cpu-2:#22d3ee;--gpu:#34d399;--gpu-2:#a3e635;
  --amber:#fbbf24;--orange:#fb7a3c;--red:#f43f5e;--violet:#a78bfa;--ok:#34d399;
  --brand:linear-gradient(135deg,#2470ff 0%,#8c48f0 52%,#ff5832 100%);
  --brand-h:linear-gradient(90deg,#2470ff 0%,#8c48f0 50%,#ff5832 100%);
  --r:16px;--r-sm:10px;
  --sans:'Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --disp:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Mono','Cascadia Code',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.45 var(--sans);user-select:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(900px 520px at 100% -10%,rgba(255,88,50,.13),transparent 60%),
   radial-gradient(800px 600px at 10% 110%,rgba(36,112,255,.13),transparent 60%),
   radial-gradient(600px 400px at 55% 40%,rgba(140,72,240,.06),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(rgba(148,163,184,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.035) 1px,transparent 1px);
  background-size:44px 44px;mask-image:radial-gradient(ellipse at 60% 30%,#000 20%,transparent 75%)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.18);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:rgba(148,163,184,.3)}
::-webkit-scrollbar-track{background:transparent}

.app{position:relative;z-index:1;display:grid;grid-template-columns:236px 1fr;height:100%}

/* barra lateral */
.side{background:linear-gradient(180deg,rgba(8,13,25,.96),rgba(7,11,20,.96));border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px 14px;gap:6px;min-height:0;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 6px 18px}
.brand svg{width:40px;height:40px;filter:drop-shadow(0 6px 16px rgba(140,72,240,.45))}
.brand b{display:block;font:700 18px/1.1 var(--disp);letter-spacing:.2px}
.brand small{display:block;color:var(--text-3);font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;margin-top:3px}
.nav-t{color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:10px 10px 6px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--text-2);font-weight:550;position:relative;transition:.18s;width:100%;text-align:left}
.nav:hover{background:rgba(148,163,184,.06);color:var(--text)}
.nav.on{background:linear-gradient(90deg,rgba(59,140,255,.16),rgba(140,72,240,.08));color:var(--text);box-shadow:inset 0 0 0 1px rgba(99,140,255,.22)}
.nav.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand)}
.nav.on svg{color:#8fb4ff}
.nav .badge{margin-left:auto;font:600 11px var(--mono);background:rgba(148,163,184,.12);color:var(--text-2);padding:1px 7px;border-radius:20px}
.nav .live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulso 1.6s infinite;display:none}
.running .nav .live{display:block}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding-top:12px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px}
.mini-h{display:flex;justify-content:space-between;color:var(--text-3);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.mini-r{display:grid;grid-template-columns:34px 1fr 46px;align-items:center;gap:8px;margin:7px 0 2px;font-size:12.5px;color:var(--text-2)}
.mini-r b{font:600 12.5px var(--mono);color:var(--text);text-align:right}
.mini-e{display:flex;align-items:center;gap:7px;margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--text-2)}
.mini-e b{margin-left:auto;font:600 12px var(--mono);color:var(--text)}
.mini-e.bat{color:#fcd34d}.mini-e.bat svg{color:var(--amber)}
.bar{height:5px;border-radius:5px;background:rgba(148,163,184,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .8s cubic-bezier(.2,.8,.2,1),background .5s}
.foot-row{display:flex;align-items:center;gap:8px}
.lang{display:inline-flex;background:rgba(148,163,184,.08);border:1px solid var(--line);border-radius:9px;padding:2px}
.lang button{padding:3px 9px;border-radius:7px;font:700 11px var(--mono);color:var(--text-3)}
.lang button.on{background:rgba(148,163,184,.18);color:var(--text)}
.upd-btn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3);padding:4px 6px;border-radius:7px}
.upd-btn:hover{color:var(--text);background:rgba(148,163,184,.08)}
.upd-btn svg{width:14px;height:14px}
.ver{color:var(--text-3);font-size:11px;text-align:center}
.ver b{color:var(--text-2)}

/* contenido */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:16px;padding:18px 28px 14px;border-bottom:1px solid var(--line);background:rgba(7,11,20,.55);backdrop-filter:blur(12px)}
.top h1{font:700 22px/1.15 var(--disp);letter-spacing:.1px}
.top p{color:var(--text-2);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt{min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:30px;border:1px solid var(--line-2);background:var(--card);font-weight:600;font-size:12.5px;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.running .pill.st{border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.10);color:#ffb3c1}
.running .pill.st .dot{background:var(--red);animation:pulso 1.4s infinite}
.pill.tm{font:600 15px var(--mono);letter-spacing:.5px}
.pill.tm small{font:500 11px var(--sans);color:var(--text-3);margin-left:2px}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line-2);background:var(--card);color:var(--text-2);transition:.18s;flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--line-3)}
.icon-btn.on{color:#c4b5fd;border-color:rgba(167,139,250,.5);background:rgba(167,139,250,.12)}
.go{position:relative;display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 22px;border-radius:12px;font-weight:700;font-size:14px;color:#fff;background:var(--brand);box-shadow:0 8px 26px -6px rgba(140,72,240,.6),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s,box-shadow .2s,filter .2s;overflow:hidden;white-space:nowrap}
.go:hover{transform:translateY(-1px);filter:brightness(1.08)}
.go:active{transform:none}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.go:hover::after{transform:translateX(120%)}
.go svg{fill:currentColor;stroke:none}
.running .go{background:linear-gradient(135deg,#f43f5e,#e11d48);box-shadow:0 8px 26px -6px rgba(244,63,94,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.go.big{height:52px;width:100%;justify-content:center;font-size:15.5px;border-radius:14px}

/* avisos fijos superiores */
.banners{display:flex;flex-direction:column;gap:10px;padding:0 28px}
.banners:not(:empty){padding-top:16px}
.banner{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 16px;border-radius:14px;border:1px solid;animation:entra .35s ease}
.banner .bi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.banner b{font:650 14px var(--disp);display:block}
.banner p{font-size:12.5px;color:var(--text-2);margin-top:1px}
.banner .acc{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.banner.bat{background:linear-gradient(90deg,rgba(251,191,36,.12),rgba(251,191,36,.04));border-color:rgba(251,191,36,.35)}
.banner.bat .bi{background:rgba(251,191,36,.16);color:var(--amber)}
.banner.upd{background:linear-gradient(90deg,rgba(140,72,240,.16),rgba(36,112,255,.08));border-color:rgba(167,139,250,.4)}
.banner.upd .bi{background:var(--brand);color:#fff}

.paginas{flex:1;min-height:0;overflow:auto;padding:22px 28px 28px}
.pag{display:none;animation:entra .35s ease}
.pag.on{display:block}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(244,63,94,.55)}70%{box-shadow:0 0 0 9px rgba(244,63,94,0)}100%{box-shadow:0 0 0 0 rgba(244,63,94,0)}}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1250px){.c3{grid-column:span 6}.c4,.c8,.c5,.c7{grid-column:span 12}}
@media (max-width:1100px){.c6{grid-column:span 12}}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);transition:border-color .25s,background .25s}
.card:hover{border-color:var(--line-2)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h3{font:650 14.5px var(--disp);letter-spacing:.1px}
.card-h .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--text-2);background:rgba(148,163,184,.08);border:1px solid var(--line);padding:3px 9px;border-radius:20px;white-space:nowrap}
.tag b{font-family:var(--mono);color:var(--text)}
.tag.amb{color:#fcd34d;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3)}
.kdot{width:8px;height:8px;border-radius:50%;flex:none}

/* medidores */
.gauge-card{display:flex;flex-direction:column;align-items:center;padding:16px 16px 18px;overflow:hidden}
.gauge-card .card-h{width:100%;margin-bottom:4px}
.gauge-card::after{content:"";position:absolute;inset:auto -30% -60% -30%;height:70%;background:radial-gradient(closest-side,var(--halo,rgba(59,140,255,.14)),transparent);pointer-events:none;transition:background .6s}
.gw{position:relative;width:176px;height:176px;margin:2px 0 -10px}
.gw svg{width:100%;height:100%;overflow:visible}
.g-track{fill:none;stroke:rgba(148,163,184,.10);stroke-width:9;stroke-linecap:round}
.g-val{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 7px var(--glow,rgba(59,140,255,.6)))}
.g-tick{stroke:rgba(148,163,184,.22);stroke-width:1.4}
.gc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:6px}
.gc .v{font:700 40px/1 var(--disp);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.gc .u{font-size:13px;color:var(--text-2);font-weight:600;margin-top:4px}
.gauge-card .foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}

/* estado termico */
.estado{display:flex;flex-direction:column;overflow:hidden}
.estado .big{display:flex;align-items:center;gap:14px;margin:4px 0 10px}
.estado .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(52,211,153,.12);color:var(--ok);border:1px solid rgba(52,211,153,.3);transition:.4s;flex:none}
.estado .ico svg{width:26px;height:26px}
.estado .w{font:700 28px/1.05 var(--disp);transition:color .4s}
.estado .d{color:var(--text-2);font-size:13px;margin-top:3px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px dashed var(--line);font-size:13px;color:var(--text-2)}
.kv b{color:var(--text);font-weight:600;font-family:var(--mono);font-size:12.5px;text-align:right}
.estado .glow{position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,var(--eg,rgba(52,211,153,.18)),transparent);pointer-events:none;transition:background .6s}

/* fichas de metricas */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{padding:15px 16px 14px}
.tile .l{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px;font-weight:550}
.tile .v{font:700 26px/1.1 var(--disp);margin:9px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-.3px;white-space:nowrap}
.tile .v small{font:600 12.5px var(--sans);color:var(--text-2);margin-left:4px;letter-spacing:0}
.tile .s{color:var(--text-3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:10px}
.tile .s.alerta{color:#ff8fa3;font-weight:600}
.tile .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.tile .ic svg{width:15px;height:15px}

/* graficos */
.chart{height:230px;position:relative}
.chart canvas{width:100%;height:100%;display:block}
.seg{display:inline-flex;background:rgba(148,163,184,.08);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{padding:4px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--text-2)}
.seg button.on{background:rgba(148,163,184,.16);color:var(--text)}
.leg{display:flex;gap:14px;font-size:12px;color:var(--text-2);flex-wrap:wrap}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg i{width:12px;height:3px;border-radius:3px}
.leg b{font-family:var(--mono);color:var(--text);font-weight:600}

/* pagina de estres */
.sec-t{font:650 13px var(--disp);color:var(--text-2);letter-spacing:.3px;margin:2px 0 12px;display:flex;align-items:center;gap:8px}
.opts{display:grid;gap:12px}
.opts.c2{grid-template-columns:1fr 1fr}.opts.c3x{grid-template-columns:repeat(3,1fr)}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line-2);background:rgba(148,163,184,.04);transition:.2s;width:100%}
.opt:hover:not(:disabled){border-color:var(--line-3);background:rgba(148,163,184,.07)}
.opt.on{border-color:rgba(124,140,255,.55);background:linear-gradient(135deg,rgba(59,140,255,.12),rgba(140,72,240,.10));box-shadow:0 0 0 3px rgba(124,140,255,.10)}
.opt.off{opacity:.45}
.opt .oi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:rgba(148,163,184,.10)}
.opt .oi svg{width:21px;height:21px}
.opt b{display:block;font:650 14.5px var(--disp);padding-right:22px}
.opt p{color:var(--text-2);font-size:12.5px;margin-top:3px}
.opt .chk{position:absolute;right:14px;top:14px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-3);display:grid;place-items:center;transition:.2s}
.opt.on .chk{background:var(--brand);border-color:transparent}
.opt .chk svg{width:12px;height:12px;stroke-width:3;color:#fff;opacity:0}
.opt.on .chk svg{opacity:1}
.heat{display:flex;gap:4px;margin-top:9px}
.heat i{width:18px;height:4px;border-radius:3px;background:rgba(148,163,184,.16)}
.heat i.f{background:linear-gradient(90deg,var(--amber),var(--orange))}
.sw{margin-left:auto;width:42px;height:24px;border-radius:20px;background:rgba(148,163,184,.2);position:relative;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.opt.on .sw{background:var(--brand)}
.opt.on .sw::after{left:21px}
.slider-row{display:flex;align-items:center;gap:16px}
.slider-row .val{font:700 26px var(--disp);min-width:96px;font-variant-numeric:tabular-nums;white-space:nowrap}
.slider-row .val small{font:600 12.5px var(--sans);color:var(--text-2);margin-left:3px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--c1,#3b8cff),var(--c2,#8c48f0)) 0/var(--p,50%) 100% no-repeat,rgba(148,163,184,.16);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:4px solid #8c48f0;box-shadow:0 0 0 4px rgba(140,72,240,.18),0 3px 10px rgba(0,0,0,.4);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;border-radius:10px;border:1px solid var(--line-2);font-size:12.5px;font-weight:600;color:var(--text-2);background:rgba(148,163,184,.04);transition:.18s}
.chip:hover{color:var(--text);border-color:var(--line-3)}
.chip.on{color:#fff;border-color:rgba(124,140,255,.55);background:linear-gradient(135deg,rgba(59,140,255,.22),rgba(140,72,240,.2))}
.note{display:flex;gap:10px;color:var(--text-2);font-size:12.5px;background:rgba(148,163,184,.05);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:14px}
.note svg{color:var(--amber);margin-top:1px}
.resumen-cfg .kv:first-of-type{border-top:0}

/* benchmark */
.bench-hero{display:grid;grid-template-columns:auto 1fr;gap:30px;align-items:center;padding:26px;overflow:hidden}
.bench-hero::before{content:"";position:absolute;left:-120px;top:-120px;width:420px;height:420px;border-radius:50%;background:radial-gradient(closest-side,rgba(140,72,240,.18),transparent);pointer-events:none}
.ring{position:relative;width:230px;height:230px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rt{fill:none;stroke:rgba(148,163,184,.1);stroke-width:12}
.ring .rv{fill:none;stroke:url(#g-ring);stroke-width:12;stroke-linecap:round;transition:stroke-dasharray 1s linear;filter:drop-shadow(0 0 10px rgba(140,72,240,.6))}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rc .n{font:800 52px/1 var(--disp);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.ring .rc .n.grad{background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent}
.ring .rc .l{color:var(--text-2);font-size:13px;font-weight:600;margin-top:6px;max-width:150px}
.bench-info h2{font:750 26px/1.15 var(--disp);margin-bottom:8px}
.bench-info>p{color:var(--text-2);font-size:13.5px;max-width:560px}
.fases{display:flex;gap:10px;margin:18px 0 22px;flex-wrap:wrap}
.fase{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line-2);background:rgba(148,163,184,.04);font-size:12.5px;color:var(--text-2);transition:.3s}
.fase .fn{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font:700 12px var(--mono);background:rgba(148,163,184,.12)}
.fase b{display:block;color:var(--text);font-weight:650;font-size:13px}
.fase.act{border-color:rgba(124,140,255,.6);background:linear-gradient(135deg,rgba(59,140,255,.14),rgba(140,72,240,.12));box-shadow:0 0 0 3px rgba(124,140,255,.1)}
.fase.act .fn{background:var(--brand);color:#fff}
.fase.ok .fn{background:rgba(52,211,153,.2);color:var(--ok)}
.bench-btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bench-btns .go{height:48px;padding:0 26px;font-size:15px}
.score-card{display:flex;flex-direction:column}
.score{font:800 56px/1 var(--disp);letter-spacing:-1.5px;background:var(--brand);-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.score small{font:600 14px var(--sans);color:var(--text-2);-webkit-text-fill-color:var(--text-2);margin-left:6px;letter-spacing:0}
.sub-score{margin-top:14px}
.sub-score .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-2);margin-bottom:6px}
.sub-score .row b{font-family:var(--mono);color:var(--text)}
.sub-score .bar{height:8px}
.delta{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:12.5px;padding:4px 10px;border-radius:20px;margin-top:12px;align-self:flex-start}
.delta.up{color:#6ee7b7;background:rgba(52,211,153,.12)}
.delta.down{color:#fda4af;background:rgba(244,63,94,.12)}
.delta.rec{color:#fde68a;background:linear-gradient(90deg,rgba(251,191,36,.18),rgba(251,122,60,.14))}
.formula{font:12px var(--mono);color:var(--text-3);margin-top:auto;padding-top:14px;line-height:1.6}
.star{color:var(--amber)}

/* sensores */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:0 13px;height:40px;width:300px;color:var(--text-3);transition:.2s}
.search:focus-within{border-color:rgba(124,140,255,.55);box-shadow:0 0 0 3px rgba(124,140,255,.12)}
.search input{background:none;border:0;outline:none;flex:1;color:var(--text);user-select:text}
.tabla{width:100%;border-collapse:separate;border-spacing:0}
.tabla th{position:sticky;top:0;background:#0d1426;z-index:1;text-align:left;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--text-3);font-weight:650;padding:11px 14px;border-bottom:1px solid var(--line)}
.tabla td{padding:10px 14px;border-bottom:1px solid rgba(148,163,184,.06);font-size:13px;white-space:nowrap}
.tabla tr:hover td{background:rgba(148,163,184,.04)}
.tabla td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tabla th.n{text-align:right}
.tabla .mb{width:120px}
.dev{font:700 10.5px var(--mono);padding:3px 7px;border-radius:6px;letter-spacing:.5px}
.dev.cpu{background:rgba(59,140,255,.14);color:#8fb4ff}
.dev.gpu{background:rgba(52,211,153,.14);color:#7ee8bb}
.tipo{color:var(--text-2)}
.tabla-wrap{max-height:calc(100vh - 230px);overflow:auto;border-radius:12px}

/* historial */
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.hc{display:flex;flex-direction:column;gap:12px}
.hc .top-r{display:flex;align-items:flex-start;gap:12px}
.hc .fecha{font:650 15px var(--disp)}
.hc .meta{color:var(--text-3);font-size:12px;margin-top:2px}
.hc .vs{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.vb{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:20px;border:1px solid;white-space:nowrap}
.vb.ok{color:#6ee7b7;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.3)}
.vb.warn{color:#fcd34d;background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.3)}
.vb.bad{color:#fda4af;background:rgba(244,63,94,.1);border-color:rgba(244,63,94,.3)}
.vb.na{color:var(--text-2);background:rgba(148,163,184,.08);border-color:var(--line-2)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.num{background:rgba(148,163,184,.05);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.num span{display:block;color:var(--text-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num b{font:700 16px var(--disp);font-variant-numeric:tabular-nums}
.spark{height:64px}
.spark canvas{width:100%;height:100%;display:block}
.acts{display:flex;gap:8px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:rgba(148,163,184,.06);font-weight:600;font-size:13px;color:var(--text);transition:.18s;white-space:nowrap}
.btn:hover{border-color:var(--line-3);background:rgba(148,163,184,.1)}
.btn.pri{border-color:transparent;background:var(--brand);box-shadow:0 6px 18px -6px rgba(140,72,240,.6)}
.btn.dan:hover{border-color:rgba(244,63,94,.5);color:#fda4af}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.vacio{text-align:center;padding:60px 20px;color:var(--text-2)}
.vacio .vi{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:rgba(148,163,184,.06);border:1px solid var(--line-2);color:var(--text-3)}
.vacio .vi svg{width:34px;height:34px}
.vacio h3{font:650 18px var(--disp);color:var(--text);margin-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(3,6,12,.62);backdrop-filter:blur(8px);padding:30px}
.modal.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{width:min(860px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#0f172b,#0b1222);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:sube .35s cubic-bezier(.2,.8,.2,1)}
.mbox.sm{width:min(520px,100%)}
@keyframes sube{from{transform:translateY(16px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;gap:14px;padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.mh::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--brand-h)}
.mh .mi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--brand);box-shadow:0 8px 20px -6px rgba(140,72,240,.6);flex:none}
.mh .mi svg{color:#fff;width:22px;height:22px}
.mh h2{font:700 19px var(--disp)}
.mh p{color:var(--text-2);font-size:12.5px;margin-top:2px}
.mh .x{margin-left:auto}
.mbody{padding:20px 24px}
.mbody pre{white-space:pre-wrap;font:13px/1.6 var(--sans);color:var(--text-2);user-select:text}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mcol{border:1px solid var(--line);background:rgba(148,163,184,.04);border-radius:14px;padding:15px}
.mcol h4{display:flex;align-items:center;gap:8px;font:650 14px var(--disp);margin-bottom:4px}
.mcol .nm{color:var(--text-3);font-size:12px;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcol .vtxt{font-size:12.5px;margin-top:10px;line-height:1.45}
.mchart{height:170px;margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(148,163,184,.03)}
.mchart canvas{width:100%;height:100%;display:block}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px 20px}

/* notificaciones */
.toasts{position:fixed;right:22px;bottom:22px;z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:11px;max-width:460px;padding:12px 16px;border-radius:13px;background:rgba(15,23,42,.94);border:1px solid var(--line-2);box-shadow:0 16px 40px -12px rgba(0,0,0,.6);font-size:13px;animation:tin .35s cubic-bezier(.2,.8,.2,1);backdrop-filter:blur(10px)}
.toast.out{animation:tout .3s forwards}
.toast svg{flex:none}
.toast.info svg{color:#8fb4ff}.toast.ok svg{color:var(--ok)}.toast.warn svg{color:var(--amber)}.toast.bad svg{color:var(--red)}
.toast.bad{border-color:rgba(244,63,94,.4)}.toast.warn{border-color:rgba(251,191,36,.35)}
@keyframes tin{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}
.hidden{display:none!important}
</style>
</head>

    <div class="banners" id="banners"></div>

    <div class="paginas">
      <!-- panel -->
      <section class="pag on" id="p-panel">

const C = 2 * Math.PI * 50, ARC = C * 0.75;
function crearGauge(id, titulo, color, icono) {
  let ticks = '';
  for (let i = 0; i <= 10; i++) {
    const a = (135 + i * 27) * Math.PI / 180, r1 = 62, r2 = i % 5 ? 65 : 67;
    ticks += `<line class="g-tick" x1="${60 + r1 * Math.cos(a)}" y1="${60 + r1 * Math.sin(a)}" x2="${60 + r2 * Math.cos(a)}" y2="${60 + r2 * Math.sin(a)}"/>`;
  }
  $('#' + id).innerHTML = `
    <div class="card-h"><span class="kdot" style="background:${color};box-shadow:0 0 10px ${color}"></span><h3>${titulo}</h3><div class="r">${ic(icono, `style="color:${color};width:16px;height:16px"`)}</div></div>
    <div class="gw"><svg viewBox="0 0 120 120">${ticks}
      <circle class="g-track" cx="60" cy="60" r="50" stroke-dasharray="${ARC} ${C}" transform="rotate(135 60 60)"/>
      <circle class="g-val" cx="60" cy="60" r="50" stroke-dasharray="0 ${C}" transform="rotate(135 60 60)"/></svg>
      <div class="gc"><div class="v">--</div><div class="u"></div></div></div>
    <div class="foot"><span class="tag t1"></span><span class="tag t2"></span></div>`;
}
function setGauge(id, valor, max, unidad, grad, glow, t1, t2) {
  const el = $('#' + id), p = valor == null ? 0 : Math.max(0, Math.min(1, valor / max));
  const arc = el.querySelector('.g-val');
  arc.setAttribute('stroke-dasharray', `${ARC * p} ${C}`);
  arc.setAttribute('stroke', `url(#${grad})`);
  arc.style.setProperty('--glow', glow + '99');

  el.querySelector('.v').textContent = valor == null ? '--' : nf(valor, 0);
  el.querySelector('.u').textContent = valor == null ? t('sinLectura') : unidad;
  const a = el.querySelector('.t1'), b = el.querySelector('.t2');

/* ---------- graficos ---------- */
function grafico(cv, series, n, opt = {}) {
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const ejes = opt.ejes !== false;
  const P = ejes ? { l: 36, r: 34, t: 8, b: 20 } : { l: 2, r: 2, t: 4, b: 2 };
  const W = w - P.l - P.r, H = h - P.t - P.b;
  if (ejes) {
    g.font = '11px "Cascadia Mono", Consolas, monospace';
    g.textBaseline = 'middle';
    for (let i = 0; i <= 4; i++) {
      const y = P.t + H * i / 4;
      g.strokeStyle = 'rgba(148,163,184,.08)'; g.lineWidth = 1; g.setLineDash([3, 4]);
      g.beginPath(); g.moveTo(P.l, y); g.lineTo(P.l + W, y); g.stroke(); g.setLineDash([]);
      g.fillStyle = 'rgba(148,163,184,.55)';
      g.textAlign = 'right'; g.fillText((100 - i * 25) + '%', P.l - 8, y);
      g.textAlign = 'left'; g.fillText(Math.round(105 - i * 105 / 4) + '°', P.l + W + 8, y);
    }
    g.textAlign = 'left'; g.fillStyle = 'rgba(148,163,184,.4)';
    g.fillText(n >= 120 ? t('haceMin', { n: Math.round(n / 60) }) : t('hace', { n }), P.l, h - 7);
    g.textAlign = 'right'; g.fillText(t('ahora'), P.l + W, h - 7);
  }
  for (const s of series) {
    const d = s.d.slice(-n);
    if (d.length < 2) continue;
    const paso = W / (n - 1), x0 = P.l + W - paso * (d.length - 1);
    const pts = d.map((v, i) => [x0 + paso * i, P.t + H - Math.max(0, Math.min(1, (v || 0) / s.max)) * H]);
    const camino = () => {
      g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) {
        const mx = (pts[i - 1][0] + pts[i][0]) / 2, my = (pts[i - 1][1] + pts[i][1]) / 2;
        g.quadraticCurveTo(pts[i - 1][0], pts[i - 1][1], mx, my);
      }
      g.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]);
    };
    if (s.relleno) {
      camino();
      g.lineTo(pts[pts.length - 1][0], P.t + H); g.lineTo(pts[0][0], P.t + H); g.closePath();
      const gr = g.createLinearGradient(0, P.t, 0, P.t + H);
      gr.addColorStop(0, s.c + '55'); gr.addColorStop(1, s.c + '00');
      g.fillStyle = gr; g.fill();
    }
    camino();
    g.strokeStyle = s.c; g.lineWidth = s.ancho || 2; g.lineJoin = 'round';
    g.shadowColor = s.c; g.shadowBlur = 10; g.stroke(); g.shadowBlur = 0;
    if (ejes) {
      const [lx, ly] = pts[pts.length - 1];
      g.fillStyle = s.c; g.beginPath(); g.arc(lx, ly, 3.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = s.c + '33'; g.beginPath(); g.arc(lx, ly, 8, 0, Math.PI * 2); g.fill();
    }
  }
}

function aviso(texto, nivel = 'info') {
  const icono = { info: 'i-info', ok: 'i-ok', warn: 'i-alert', bad: 'i-alert' }[nivel] || 'i-info';
  const el = document.createElement('div');
  el.className = 'toast ' + nivel;
  el.innerHTML = ic(icono) + `<span>${esc(texto)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 320); }, nivel === 'bad' || nivel === 'warn' ? 7000 : 4200);
}
function avisoCodigo(m) {
  let txt;
  switch (m.codigo) {
    case 'iniciada': {
      const partes = [];
      if (m.cpu) partes.push(`CPU ${modoNombre(m.modo)} (${m.hilos} ${t('hilos')})`);
      if (m.gpu) partes.push('GPU ' + m.gpu);
      txt = t('a.iniciada') + ' · ' + partes.join(' · ');
      break;
    }
    case 'csvOk': txt = t('a.csvOk', { r: m.ruta }); break;
    case 'csvError': txt = t('a.csvError', { e: m.error }); break;
    default: txt = t('a.' + m.codigo, { l: m.limite });
  }
  aviso(txt, m.nivel);
}

function empujar(arr, v) { arr.push(v == null ? 0 : v); if (arr.length > 300) arr.shift(); }

function estado(e, repintar = false) {
  const prev = S.est; S.est = e;
  const cpu = e.cpu, gpu = e.gpu, bench = e.ejecucion === 'bench';
  document.body.classList.toggle('running', e.corriendo);
  $('#stTxt').textContent = t(bench ? 'st.bench' : e.corriendo ? 'st.prueba' : 'st.reposo');

  const txtGo = bench ? t('btn.cancelar') : e.corriendo ? t('btn.detener') : t('btn.iniciar');
  $$('#btnGo span,#btnGo2 span').forEach(s => s.textContent = txtGo);

  $('#btnBench span').textContent = bench ? t('btn.cancelar') : e.corriendo ? t('btn.detener') : t('b.iniciar');

  if (prev?.corriendo !== e.corriendo || repintar) $$('#oCpu,#oGpu,#modos .opt,#gpus .opt').forEach(b => b.disabled = e.corriendo);
  if (S.pag === 'panel') $('#sub').textContent = `${S.info?.cpu || ''} · ${gpu.nombre}`;

  if (!repintar) { empujar(S.h.cu, cpu.uso); empujar(S.h.ct, cpu.temp); empujar(S.h.gu, gpu.uso); empujar(S.h.gt, gpu.temp); }

  // medidores
  setGauge('gCpuTemp', cpu.temp, 105, '°C', gradTemp(cpu.temp), colTemp(cpu.temp),
    cpu.tempMax ? `${t('max')} <b>${nf(cpu.tempMax)}°</b>` : '', cpu.temp == null ? t('reqAdmin') : cpu.pot ? `<b>${nf(cpu.pot, 1)}</b> W` : '');
  setGauge('gCpuUso', cpu.uso, 100, t('u.uso'), 'g-cpu', '#3b8cff',

  setGauge('gGpuTemp', gpu.temp, 105, '°C', gradTemp(gpu.temp), colTemp(gpu.temp),
    gpu.hot ? `hot spot <b>${nf(gpu.hot)}°</b>` : gpu.sinSensores ? t('sinSensores') : '', gpu.tempMax ? `${t('max')} <b>${nf(gpu.tempMax)}°</b>` : '');
  setGauge('gGpuUso', gpu.uso, 100, t('u.uso'), 'g-gpu', '#34d399',
    gpu.frec ? `<b>${nf(gpu.frec)}</b> MHz` : '', gpu.pot ? `<b>${nf(gpu.pot, 1)}</b> W` : '');

  // fichas
  setTile('tCpuFrec', cpu.frec == null ? null : nf(cpu.frec), 'MHz',
    cpu.throttling ? t('throttlingPos') : cpu.picoFrec ? `${t('pico')} ${nf(cpu.picoFrec)} MHz` : t('promNucleos'), cpu.frec / 5200, cpu.throttling);
  setTile('tCpuPot', cpu.pot == null ? null : nf(cpu.pot, 1), 'W', cpu.potMax ? `${t('maxima')} ${nf(cpu.potMax, 1)} W` : t('consumoPaquete'), cpu.pot / 120);
  setTile('tCpuRend', cpu.rend == null ? null : nf(cpu.rend, cpu.rend < 100 ? 1 : 0), cpu.unidad, cpu.activo ? modoNombre(cpu.modo) : t('seMide'), cpu.rend == null ? 0 : 1);
  setTile('tGpuFrec', gpu.frec == null ? null : nf(gpu.frec), 'MHz', t('relojNucleo'), gpu.frec / 3000);
  setTile('tGpuPot', gpu.pot == null ? null : nf(gpu.pot, 1), 'W', gpu.potMax ? `${t('maxima')} ${nf(gpu.potMax, 1)} W` : t('consumoTarjeta'), gpu.pot / 140);
  setTile('tGpuRend', gpu.rend == null ? null : nf(gpu.rend), 'GFLOPS', gpu.activo ? 'FP32 · compute shader' : t('seMide'), gpu.rend == null ? 0 : 1);

  // leyendas

  $('#lgGu').textContent = nf(gpu.uso) + '%'; $('#lgGt').textContent = gpu.temp == null ? '--' : nf(gpu.temp) + '°';

function estadoTermico(e) {
  const cpu = e.cpu, gpu = e.gpu;
  const tm = Math.max(cpu.temp || 0, gpu.temp || 0) || null;
  let k, color, icono;
  if (cpu.throttling) { k = 'throttling'; color = '#f43f5e'; icono = 'i-alert'; }
  else if (tm == null) { k = 'sinDatos'; color = '#9aa6bb'; icono = 'i-info'; }
  else if (tm >= 95) { k = 'critico'; color = '#f43f5e'; icono = 'i-flame'; }
  else if (tm >= 85) { k = 'caliente'; color = '#fb7a3c'; icono = 'i-flame'; }
  else if (tm >= 70) { k = 'templado'; color = '#fbbf24'; icono = 'i-temp'; }
  else { k = 'fresco'; color = '#22d3ee'; icono = 'i-snow'; }
  const d = k === 'caliente' || k === 'fresco' ? t('d.' + k + (e.corriendo ? 'C' : 'R')) : t('d.' + k);
  $('#estW').textContent = t('w.' + k); $('#estW').style.color = color; $('#estD').textContent = d;
  const ico = $('#estIco');
  ico.style.color = color; ico.style.background = color + '1f'; ico.style.borderColor = color + '55';
  ico.querySelector('use').setAttribute('href', '#' + icono);
  $('#estadoCard').style.setProperty('--eg', color + '2e');
  $('#estadoTag').textContent = e.ejecucion === 'bench' ? 'benchmark' : e.corriendo ? t('enPrueba') : t('reposo');
  $('#kvThr').textContent = cpu.throttling ? t('si') : t('no');
  $('#kvThr').style.color = cpu.throttling ? '#fda4af' : '';
  const cargas = [];
  if (cpu.activo) cargas.push('CPU ' + modoNombre(cpu.modo).toLowerCase());
  if (gpu.activo) cargas.push('GPU');
  $('#kvCarga').textContent = cargas.join(' + ') || t('ninguna');
}

/* ---------- benchmark ---------- */
const RING = 2 * Math.PI * 88;
function progresoBench(e) {
  const b = e.bench, ring = $('#ringV');
  const f1 = $('#fase1'), f2 = $('#fase2'), f3 = $('#fase3');
  [f1, f2, f3].forEach(f => f.classList.remove('act', 'ok'));
  if (b) {
    const p = Math.min(1, b.segundos / b.total);
    ring.setAttribute('stroke-dasharray', `${RING * p} ${RING}`);
    $('#ringN').textContent = Math.max(0, b.total - b.segundos);
    $('#ringN').classList.remove('grad');
    $('#ringL').textContent = b.fase === 1 ? t('b.faseCpu') : t('b.faseGpu');
    if (b.fase === 1) f1.classList.add('act'); else { f1.classList.add('ok'); f2.classList.add('act'); }
    return;
  }
  const r = S.ultimoBench;
  if (r) {
    ring.setAttribute('stroke-dasharray', `${RING} ${RING}`);
    $('#ringN').textContent = nf(r.total);
    $('#ringN').classList.add('grad');
    $('#ringL').textContent = t('b.puntos');
    f1.classList.add('ok'); f2.classList.add('ok'); f3.classList.add('ok');
  } else {
    ring.setAttribute('stroke-dasharray', `0 ${RING}`);
    $('#ringN').textContent = '60';
    $('#ringN').classList.remove('grad');
    $('#ringL').textContent = t('b.listo');
  }
}
function pintarBench() {
  const l = S.benchs;
  const validos = l.filter(b => !b.conBateria);
  const mejor = validos.length ? Math.max(...validos.map(b => b.total)) : 0;
  $('#nBench').textContent = mejor ? nf(mejor) : '--';
  const r = S.ultimoBench || l[0];
  if (!r) {
    $('#scoreCard').innerHTML = `<div class="vacio" style="padding:30px 10px"><div class="vi">${ic('i-trophy')}</div><h3>${t('b.sinRes')}</h3><p>${t('b.sinResD')}</p></div>
      <div class="note">${ic('i-info')}<span>${t('b.consejo')}</span></div>`;
  } else {
    const ref = S.ultimoBench ? S.mejorAnterior : Math.max(0, ...validos.filter(b => b.id !== r.id).map(b => b.total));
    let delta = '';
    if (r.conBateria) delta = `<span class="delta down">${ic('i-battery', 'style="width:14px;height:14px"')}${t('b.noComparable')}</span>`;
    else if (ref > 0 && r.total > ref) delta = `<span class="delta rec">${ic('i-trophy', 'style="width:14px;height:14px"')}${t('b.record')} (+${nf((r.total / ref - 1) * 100, 1)}%)</span>`;
    else if (ref > 0) { const p = (r.total / ref - 1) * 100; delta = `<span class="delta ${p >= 0 ? 'up' : 'down'}">${t('b.vsMejor', { p: (p >= 0 ? '+' : '') + nf(p, 1) + '%' })}</span>`; }
    const maxSub = Math.max(r.puntajeCpu, r.puntajeGpu, 1);
    $('#scoreCard').innerHTML = `<div class="card-h"><h3>${t('b.ultimo')}</h3><div class="r"><span class="tag">${fecha(r.fecha)}</span></div></div>
      <div class="score">${nf(r.total)}<small>${t('b.puntos')}</small></div>${delta}
      <div class="sub-score"><div class="row"><span>CPU · ${nf(r.cpuGflops, 1)} GFLOPS</span><b>${nf(r.puntajeCpu)}</b></div><div class="bar"><i style="width:${r.puntajeCpu / maxSub * 100}%;background:linear-gradient(90deg,#2470ff,#22d3ee)"></i></div></div>
      <div class="sub-score"><div class="row"><span>GPU · ${r.conGpu ? nf(r.gpuGflops) + ' GFLOPS' : t('e.noDisp')}</span><b>${nf(r.puntajeGpu)}</b></div><div class="bar"><i style="width:${r.puntajeGpu / maxSub * 100}%;background:linear-gradient(90deg,#10b981,#a3e635)"></i></div></div>
      <div class="formula">${esc(t('b.formula')).replace(/\n/g, '<br>')}</div>`;
  }
  if (!l.length) { $('#benchLista').innerHTML = `<div style="color:var(--text-3);font-size:13px;padding:6px 2px">${t('b.sinResD')}</div>`; return; }
  $('#benchLista').innerHTML = `<div class="tabla-wrap" style="max-height:none"><table class="tabla"><thead><tr><th>${t('th.fecha')}</th><th class="n">${t('th.total')}</th><th class="n">CPU</th><th class="n">GPU</th><th class="n">${t('th.temps')}</th><th></th></tr></thead><tbody>
    ${l.map(b => `<tr><td>${b.total === mejor && !b.conBateria ? `<span class="star">★</span> ` : ''}${fecha(b.fecha)}<div style="color:var(--text-3);font-size:11.5px">${esc(b.nombreCpu)}${b.conGpu ? ' · ' + esc(b.nombreGpu) : ''}</div></td>
      <td class="n" style="font-weight:700;color:var(--text)">${nf(b.total)}</td><td class="n">${nf(b.puntajeCpu)}</td><td class="n">${nf(b.puntajeGpu)}</td>
      <td class="n"><span style="color:${colTemp(b.cpuTempMax)}">${b.cpuTempMax ? nf(b.cpuTempMax) + '°' : '--'}</span> / <span style="color:${colTemp(b.gpuTempMax)}">${b.gpuTempMax ? nf(b.gpuTempMax) + '°' : '--'}</span></td>
      <td>${b.conBateria ? `<span class="tag amb">${ic('i-battery', 'style="width:13px;height:13px"')}${t('h.bateria')}</span>` : b.total === mejor ? `<span class="tag" style="color:#fde68a">${t('b.mejor')}</span>` : ''}</td></tr>`).join('')}
    </tbody></table></div>`;
}

/* ---------- sensores ---------- */
const TIPOS = { 'temp c': ['tp.temp', '°C', 0], 'uso %': ['tp.uso', '%', 1], 'mhz': ['tp.mhz', 'MHz', 2], 'watts': ['tp.w', 'W', 3], 'volts': ['tp.v', 'V', 4], 'mb': ['tp.mb', 'MB', 5], 'rpm': ['tp.rpm', 'RPM', 6] };
function pintarFiltros() {
  const F = [['todos', t('f.todos')], ['cpu', 'CPU'], ['gpu', 'GPU'], ['temp c', t('tp.temp')], ['uso %', t('tp.uso')], ['mhz', t('tp.mhz')], ['watts', t('tp.w')]];
  $('#filtros').innerHTML = F.map(([k, x]) => `<button class="chip${k === S.filtro ? ' on' : ''}" data-f="${k}">${x}</button>`).join('');
  $$('#filtros .chip').forEach(b => b.onclick = () => { S.filtro = b.dataset.f; $$('#filtros .chip').forEach(x => x.classList.toggle('on', x === b)); tablaSensores(); });
}
function tablaSensores() {
  if (!S.est) return;
  const f = S.filtro, q = S.buscar;
  const filas = S.est.sensores
    .filter(s => f === 'todos' || s.d === f || s.t === f)
    .filter(s => !q || (s.n + ' ' + s.d + ' ' + t(TIPOS[s.t]?.[0] || '')).toLowerCase().includes(q))
    .sort((a, b) => a.d.localeCompare(b.d) || (TIPOS[a.t]?.[2] ?? 9) - (TIPOS[b.t]?.[2] ?? 9));
  $('#tb').innerHTML = filas.map(s0 => {
    const s = s0.t === 'uso %' ? { ...s0, v: Math.min(100, s0.v), m: Math.min(100, s0.m) } : s0;
    const [tk, u] = TIPOS[s.t] || [s.t, ''];
    const d = s.t === 'volts' ? 3 : s.t === 'mhz' || s.t === 'rpm' ? 0 : 1;
    let barra = '';
    if (s.t === 'temp c') barra = `<div class="bar"><i style="width:${Math.min(100, s.v / 105 * 100)}%;background:${colTemp(s.v)}"></i></div>`;
    else if (s.t === 'uso %') barra = `<div class="bar"><i style="width:${s.v}%;background:${s.d === 'gpu' ? '#34d399' : '#3b8cff'}"></i></div>`;
    const color = s.t === 'temp c' ? `style="color:${colTemp(s.v)}"` : '';
    return `<tr><td><span class="dev ${s.d}">${s.d.toUpperCase()}</span></td><td class="tipo">${t(tk)}</td><td>${esc(s.n)}</td><td class="mb">${barra}</td>
      <td class="n" ${color}>${nf(s.v, d)} <span style="color:var(--text-3)">${u}</span></td><td class="n" style="color:var(--text-2)">${nf(s.m, d)}</td></tr>`;
  }).join('') || `<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:40px">${t('s.vacio')}</td></tr>`;
}

        <div class="num"><span>GPU GFLOPS</span><b>${r.conGpu ? nf(r.gpu.rend) : '--'}</b></div>
      </div>
      <div class="spark"><canvas data-id="${esc(r.id)}"></canvas></div>
      <div class="acts"><button class="btn" data-csv="${esc(r.id)}">${ic('i-down')}CSV</button><button class="btn pri" data-ver="${esc(r.id)}">${ic('i-chart')}${t('h.ver')}</button></div>
    </div>`).join('');
  $$('#hist canvas').forEach(cv => {
    const r = l.find(x => x.id === cv.dataset.id);
    const n = Math.max(r.serie.cpuTemp.length, r.serie.gpuTemp.length, 2);
    const s = [];
    if (r.conCpu) s.push({ d: r.serie.cpuTemp, c: '#3b8cff', max: 105, relleno: true, ancho: 1.6 });
    if (r.conGpu) s.push({ d: r.serie.gpuTemp, c: '#34d399', max: 105, relleno: true, ancho: 1.6 });
    grafico(cv, s, n, { ejes: false });
  });
  $$('#hist [data-ver]').forEach(b => b.onclick = () => resumen(l.find(x => x.id === b.dataset.ver)));
  $$('#hist [data-csv]').forEach(b => b.onclick = () => enviar({ accion: 'exportar', id: b.dataset.csv }));
}

/* ---------- modal ---------- */
function cerrarModal() { $('#modal').classList.remove('on'); }
$('#modal').onclick = e => { if (e.target.id === 'modal') cerrarModal(); };

function verTxt(codigo, x) {
  if (codigo === 'gpu.hot') return t('v.gpu.hot', { d: nf((x.hot || 0) - (x.temp || 0)) });
  return I18N.es['v.' + codigo] ? t('v.' + codigo) : codigo;
}
function colResumen(titulo, color, icono, nombre, x, filas) {
  return `<div class="mcol"><h4>${ic(icono, `style="color:${color}"`)}${titulo}<span class="vb ${x.nivel}" style="margin-left:auto">${t('ver.' + x.nivel)}</span></h4>
    <div class="nm">${esc(nombre)}</div>${filas.map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}
    <div class="vtxt" style="color:${{ ok: '#6ee7b7', warn: '#fcd34d', bad: '#fda4af', na: 'var(--text-2)' }[x.nivel]}">${esc(verTxt(x.veredicto, x))}</div></div>`;
}
function resumen(r) {
  if (!r) return;
  const nd = 'n/d';
  const modo = r.modoIndice >= 0 ? modoNombre(r.modoIndice) : (r.modo || '');
  const cols = [];
  if (r.conCpu) cols.push(colResumen(t('r.procesador'), '#3b8cff', 'i-cpu', `${r.nombreCpu} · ${modo} · ${r.hilos} ${t('hilos')}`, r.cpu, [
    [t('r.tempEst'), r.cpu.temp ? nf(r.cpu.temp, 1) + ' °C' : nd], [t('r.tempMax'), r.cpu.tempMax ? nf(r.cpu.tempMax, 1) + ' °C' : nd],
    [t('r.frec'), r.cpu.frec ? nf(r.cpu.frec) + ' MHz' : nd], [t('r.pot'), r.cpu.pot ? nf(r.cpu.pot, 1) + ' W' : nd],
    [t('r.rend'), r.cpu.rend ? nf(r.cpu.rend, 1) + ' ' + r.unidad : nd]]));
  if (r.conGpu) cols.push(colResumen(t('r.tarjeta'), '#34d399', 'i-gpu', r.nombreGpu, r.gpu, [
    [t('r.tempEst'), r.gpu.temp ? nf(r.gpu.temp, 1) + ' °C' : nd], [t('r.tempMax'), r.gpu.tempMax ? nf(r.gpu.tempMax, 1) + ' °C' : nd],
    [t('r.hot'), r.gpu.hot ? nf(r.gpu.hot, 1) + ' °C' : nd], [t('r.pot'), r.gpu.pot ? nf(r.gpu.pot, 1) + ' W' : nd],
    [t('r.rend'), r.gpu.rend ? nf(r.gpu.rend) + ' GFLOPS' : nd]]));
  $('#mbox').className = 'mbox';
  $('#mbox').innerHTML = `
    <div class="mh"><div class="mi">${ic('i-chart')}</div><div><h2>${t('r.titulo')}</h2><p>${fecha(r.fecha)} · ${t('r.duracion')} ${esc(r.duracion)} · ${esc(motivoTxt(r.motivo))}</p></div>
      <button class="icon-btn x" onclick="cerrarModal()">${ic('i-x')}</button></div>
    <div class="mbody">${r.conBateria ? `<div class="note" style="margin:0 0 16px">${ic('i-battery')}<span>${t('r.bateria')}</span></div>` : ''}
      <div class="mcols" style="${cols.length === 1 ? 'grid-template-columns:1fr' : ''}">${cols.join('')}</div>
      <div class="mchart"><canvas id="mch"></canvas></div>
      <div class="leg" style="margin-top:10px;justify-content:center">${r.conCpu ? '<span><i style="background:#3b8cff"></i>Temp CPU</span>' : ''}${r.conGpu ? '<span><i style="background:#34d399"></i>Temp GPU</span>' : ''}<span style="color:var(--text-3)">${t('r.nota')}</span></div></div>
    <div class="mf"><button class="btn" onclick="enviar({accion:'exportar',id:'${esc(r.id)}'})">${ic('i-down')}${t('r.exportar')}</button><button class="btn pri" onclick="cerrarModal()">${t('r.listo')}</button></div>`;
  $('#modal').classList.add('on');
  requestAnimationFrame(() => {
    const s = [];
    if (r.conCpu) s.push({ d: r.serie.cpuTemp, c: '#3b8cff', max: 105, relleno: true });
    if (r.conGpu) s.push({ d: r.serie.gpuTemp, c: '#34d399', max: 105, relleno: true });
    grafico($('#mch'), s, Math.max(2, r.serie.cpuTemp.length, r.serie.gpuTemp.length), { ejes: false });
  });
}
function confirmar(titulo, texto, boton, ok) {
  $('#mbox').className = 'mbox sm';
  $('#mbox').innerHTML = `<div class="mh"><div class="mi" style="background:linear-gradient(135deg,#f43f5e,#e11d48)">${ic('i-trash')}</div><div><h2>${esc(titulo)}</h2><p>${esc(texto)}</p></div></div>
    <div class="mf"><button class="btn" onclick="cerrarModal()">${t('c.cancelar')}</button><button class="btn pri" id="mOk" style="background:linear-gradient(135deg,#f43f5e,#e11d48)">${esc(boton)}</button></div>`;
  $('#mOk').onclick = () => { cerrarModal(); ok(); };
  $('#modal').classList.add('on');
}

/* ---------- mensajes desde la app ---------- */
window.chrome?.webview?.addEventListener('message', ev => {
  const m = ev.data;
  switch (m.tipo) {
    case 'init':
      S.info = m; S.historial = m.historial || []; S.benchs = m.benchs || [];
      if (m.config) Object.assign(S.cfg, m.config);
      LANG = S.cfg.idioma === 'en' || S.cfg.idioma === 'es' ? S.cfg.idioma : m.idioma;
      if (m.config?.encima) { S.encima = true; $('#btnPin').classList.add('on'); enviar({ accion: 'encima', valor: true }); }
      $('#ver').textContent = 'v' + m.version;
      enviar({ accion: 'gpu', indice: S.cfg.gpuIndice >= 0 && S.cfg.gpuIndice < m.gpus.length ? S.cfg.gpuIndice : m.gpuSel });
      aplicarIdioma();
      break;
    case 'estado': estado(m); break;
    case 'aviso': avisoCodigo(m); break;
    case 'detenido':
      aviso(t('toast.fin', { m: motivoTxt(m.motivo, m.limite) }), m.alarma ? 'bad' : 'ok');
      if (m.resumen) { S.historial.unshift(m.resumen); if (S.historial.length > 30) S.historial.pop(); pintarHistorial(); }
      if (m.mostrar && m.resumen) resumen(m.resumen);
      break;
    case 'benchFin':
      if (m.resultado) {
        S.ultimoBench = m.resultado; S.mejorAnterior = m.mejorAnterior || 0;
        S.benchs.unshift(m.resultado);
        aviso(`${t('b.titulo')}: ${nf(m.resultado.total)} ${t('b.puntos')}`, 'ok');
        ir('bench');
      }
      pintarBench();
      if (S.est) progresoBench(S.est);
      break;
    case 'historial': S.historial = m.lista; pintarHistorial(); aviso(t('a.historialBorrado'), 'ok'); break;
    case 'benchs': S.benchs = m.lista; S.ultimoBench = null; pintarBench(); if (S.est) progresoBench(S.est); aviso(t('a.benchsBorrados'), 'ok'); break;
    case 'actualizacion':
      if (m.hay) { S.actualizacion = m; pintarBanners(); }
      else aviso(m.error ? t('up.error') : m.version ? t('up.alDia', { v: 'v' + S.info.version }) : t('up.sinRelease'), m.error ? 'warn' : 'ok');
      break;
  }
});

aplicarIdioma();
new ResizeObserver(() => { if (S.pag === 'panel') dibujarGraficos(); }).observe($('.paginas'));
enviar({ accion: 'listo' });
</script>
</body>
</html>
